// 全局变量
let currentQuestion = 0;
let answers = [];
let currentPersona = null;

// 3. 测试核心逻辑
function startTest() {
  document.getElementById('page1').classList.add('hidden');
  document.getElementById('page2').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQuestion];
  const highlighted = q.text.replace(/(.+)/g, '<span class="question-highlight">$1</span>');
  document.getElementById('question').innerHTML = highlighted;

  const answersEl = document.getElementById('answers');
  answersEl.innerHTML = '';

  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'w-full p-4 border border-gray-200 rounded-xl text-left hover:bg-light hover:border-primary transition';
    btn.innerText = opt;
    btn.onclick = () => selectAnswer(i);
    answersEl.appendChild(btn);
  });

  updateProgress();
}

function selectAnswer(index) {
  answers.push(index);
  currentQuestion++;
  if (currentQuestion >= questions.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function updateProgress() {
  const percent = (currentQuestion / questions.length) * 100;
  document.getElementById('progress-bar').style.width = percent + '%';
  document.getElementById('progress-text').innerText = `${currentQuestion}/${questions.length}`;
}

// 4. 显示测试结果
function showResult() {
  document.getElementById('page2').classList.add('hidden');
  document.getElementById('page3').classList.remove('hidden');

  // 计算人格类型
  const freq = Array(6).fill(0);
  answers.forEach(a => freq[a]++);
  let max = 0, type = 0;
  for (let i = 0; i < 6; i++) {
    if (freq[i] > max) {
      max = freq[i];
      type = i;
    }
  }

  currentPersona = personalityTypes[type];

  // 填充结果页数据
  document.getElementById('result-img').src = currentPersona.img;
  document.getElementById('result-title').innerText = currentPersona.name;
  document.getElementById('result-subtitle').innerText = currentPersona.subtitle;
  document.getElementById('result-desc').innerText = currentPersona.original_desc;
  document.getElementById('result-tag').innerText = currentPersona.slogan;

  // 渲染性格标签
  const tagsEl = document.getElementById('persona-tags');
  tagsEl.innerHTML = '';
  currentPersona.tags.forEach(tag => {
    const tagEl = document.createElement('span');
    tagEl.className = 'bg-gray-100 text-gray-800 px-3 py-1 rounded-full text-sm mr-2 mb-2';
    tagEl.innerText = tag;
    tagsEl.appendChild(tagEl);
  });

  // 显示下载按钮
  document.getElementById('download-btn').classList.remove('hidden');
}

// 5. 海报生成逻辑
function showPoster() {
  document.getElementById('page3').classList.add('hidden');
  document.getElementById('page4').classList.remove('hidden');
  document.getElementById('poster-canvas').style.display = 'block';

  // 填充海报数据
  document.getElementById('poster-name').innerText = currentPersona.name;
  document.getElementById('poster-subtitle').innerText = currentPersona.subtitle;
  document.getElementById('poster-slogan').innerText = currentPersona.slogan;
  document.getElementById('poster-desc').innerText = currentPersona.desc;

  // 绘制人格图标
  const iconEl = document.getElementById('poster-icon');
  iconEl.style.color = currentPersona.icon_color;
  iconEl.innerHTML = getPersonaIcon(currentPersona.name);

  // 渲染海报标签
  const posterTagsEl = document.getElementById('poster-tags');
  posterTagsEl.innerHTML = '';
  currentPersona.tags.forEach(tag => {
    const tagEl = document.createElement('span');
    tagEl.className = 'poster-tag';
    tagEl.innerText = tag;
    posterTagsEl.appendChild(tagEl);
  });
}

// 根据人格生成对应图标
function getPersonaIcon(name) {
  if (name.startsWith('拼单卷王')) return '<i class="fa fa-users fa-2x"></i>';
  if (name.startsWith('铁公鸡')) return '<i class="fa fa-calculator fa-2x"></i>';
  if (name.startsWith('佛系')) return '<i class="fa fa-pagelines fa-2x"></i>';
  if (name.startsWith('独行')) return '<i class="fa fa-times fa-2x"></i>';
  if (name.startsWith('跟风')) return '<i class="fa fa-arrow-up fa-2x"></i>';
  return '<i class="fa fa-shopping-basket fa-2x"></i>';
}

// 下载海报（兼容移动端）
function downloadPoster() {
  // 解决移动端下载问题
  const canvasElement = document.getElementById('poster-canvas');

  html2canvas(canvasElement, {
    useCORS: true, // 解决跨域图片问题
    scale: 2, // 提高分辨率
    logging: false
  }).then(canvas => {
    const link = document.createElement('a');
    // 适配移动端文件名
    const fileName = encodeURIComponent(currentPersona.name) + '.png';
    link.download = fileName;
    link.href = canvas.toDataURL('image/png', 1.0);

    // 兼容移动端点击
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    // 提示
    alert('海报已开始下载～');
  }).catch(err => {
    console.error('下载失败:', err);
    alert('海报下载失败，请重试～');
  });
}

}
